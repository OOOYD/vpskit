name: Bug report
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不要贴节点 IP、UUID、订阅路径、流量 key、私钥。先跑 `vpskit doctor` 和 `vpskit plan <node> --json`。
  - type: input
    id: version
    attributes: {label: vpskit 版本, placeholder: "1.0.0 / git commit"}
  - type: input
    id: os
    attributes: {label: 本机/目标机 OS, placeholder: "macOS 15 / Debian 13"}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤}
  - type: textarea
    id: expected
    attributes: {label: 期望结果}
  - type: textarea
    id: actual
    attributes: {label: 实际结果/脱敏日志}
  - type: checkboxes
    id: secrets
    attributes:
      label: 确认
      options:
        - label: 我没有在 issue 里包含任何真实秘密
          required: true
