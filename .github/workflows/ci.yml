name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: python -m pip install --upgrade pip setuptools wheel pyyaml
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Console entry point
        run: vpskit --version
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Compile
        run: python -m compileall -q vpskitlib tests
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/check-secrets.sh
          for f in vpskitlib/assets/opt/ops/ops vpskitlib/assets/opt/ops/xray_selfheal.sh vpskitlib/assets/opt/traffic/traffic-snapshot.sh; do bash -n "$f"; done
      - name: Secret scan (working tree)
        run: ./scripts/check-secrets.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel pyyaml
          python -m pip install --no-deps -e .
      - name: Console entry point
        run: vpskit --version
      - name: Cross-platform imports
        run: python -c "import vpskitlib.apply, vpskitlib.plan, vpskitlib.verify, vpskitlib.locking"
      - name: Unit tests (cross-platform subset)
        run: python -m unittest tests.test_crypto tests.test_config tests.test_render tests.test_secrets tests.test_plan_fake tests.test_redact tests.test_panel tests.test_server tests.test_cli -v
